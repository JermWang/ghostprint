<!doctype html>
<html><head><meta charset="utf-8"><title>Ghostprint brand</title>
<link href="../../videos/source/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ground:#D6D8D9;--paper:#EEEFEE;--ink:#1D1F22;--mute:#5F646B;--accent:#FF5A24}
html,body{margin:0;overflow:hidden}
#c{position:relative;overflow:hidden;font-family:"Sora",system-ui,sans-serif;color:var(--ink)}
#c svg{display:block;overflow:visible}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(29,31,34,.17) 1.4px,transparent 1.7px);background-size:20px 20px}
.copy{position:absolute;display:flex;flex-direction:column;gap:20px}
.copy h1{margin:0;font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em}
.copy p{margin:0;font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.copy p b{color:var(--accent)}
</style></head>
<body><div id="c"></div><script type="module" src="brand.js"></script></body></html>
